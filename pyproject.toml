[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sa-cli"
version = "0.2.0"
description = "基于 JSON 指令集的频谱分析仪 & 信号发生器 CLI 控制与测量工具"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pyvisa>=1.11",
    "pyvisa-py>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
sa-cli = "sa_cli.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sa_cli.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
